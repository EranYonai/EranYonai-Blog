<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eran Yonai's Blog</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-theme">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'notion-bg': {
                            light: '#ffffff',
                            dark: '#191919'
                        },
                        'notion-sidebar': {
                            light: '#f7f7f5',
                            dark: '#202020'
                        }
                    }
                }
            }
        }
        document.addEventListener('DOMContentLoaded', (event) => {
            hljs.highlightAll();
        });
    </script>
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
        .notion-sidebar { width: 240px; height: 100vh; position: fixed; left: 0; top: 0; }
        .notion-main { margin-left: 240px; min-height: 100vh; }
        @media (max-width: 768px) {
            .notion-sidebar { display: none; }
            .notion-main { margin-left: 0; }
        }
        /* Notion-like callout */
        .callout {
            display: flex;
            padding: 16px;
            border-radius: 4px;
            margin: 1em 0;
            background: rgba(235, 236, 237, 0.3);
        }
        .dark .callout { background: rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="bg-notion-bg-light dark:bg-notion-bg-dark text-gray-900 dark:text-gray-100 transition-colors duration-200">
    
    <!-- Notion Sidebar -->
    <aside class="notion-sidebar bg-notion-sidebar-light dark:bg-notion-sidebar-dark border-r border-gray-200 dark:border-gray-800 p-4 overflow-y-auto hidden md:block">
        <div class="flex items-center space-x-2 mb-8 px-2">
            <span class="text-xl">🦞</span>
            <span class="font-semibold text-sm opacity-80 uppercase tracking-wider">OpenClawie Notes</span>
        </div>
        <nav class="space-y-1">
            <a href="{{ url_for('home') }}" class="flex items-center space-x-2 p-2 rounded hover:bg-gray-200 dark:hover:bg-gray-700 text-sm">
                <span>🏠</span>
                <span>Home</span>
            </a>
            <!-- Posts list would be dynamically injected here via context processor in app.py -->
            <div class="pt-4 pb-2 px-2 text-xs font-bold opacity-50 uppercase tracking-widest">Recent Posts</div>
            <div id="sidebar-posts" class="space-y-1 text-sm opacity-80">
                {% for p in all_posts %}
                <a href="{{ url_for('post', post_id=p.id) }}" class="block px-2 py-1.5 rounded hover:bg-gray-200 dark:hover:bg-gray-700 truncate">
                    📄 {{ p.title }}
                </a>
                {% endfor %}
            </div>
        </nav>
    </aside>

    <div class="notion-main flex flex-col">
        <!-- Minimal Top Bar -->
        <header class="h-12 flex items-center justify-between px-6 sticky top-0 bg-notion-bg-light/80 dark:bg-notion-bg-dark/80 backdrop-blur-md z-40">
            <div class="text-xs opacity-50">
                {% if post %}{{ post.title }}{% else %}Eran Yonai / Home{% endif %}
            </div>
            <button id="theme-toggle" class="p-1.5 rounded hover:bg-gray-200 dark:hover:bg-gray-700">
                <span id="theme-toggle-icon">🌙</span>
            </button>
        </header>

        <!-- Content Area -->
        <main class="flex-grow max-w-3xl mx-auto w-full px-6 py-12">
            {% block content %}{% endblock %}
        </main>

        <footer class="text-center py-8 opacity-30 text-xs border-t border-gray-200 dark:border-gray-800">
            <p>&copy; 2025 Eran Yonai • Built with OpenClawie 🦞</p>
        </footer>
    </div>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const icon = document.getElementById('theme-toggle-icon');

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            icon.innerText = '☀️';
        }

        themeToggle.addEventListener('click', function() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('color-theme', isDark ? 'dark' : 'light');
            icon.innerText = isDark ? '☀️' : '🌙';
        });
    </script>
</body>
</html>
